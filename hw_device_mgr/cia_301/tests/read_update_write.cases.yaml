# Test cases for bogus BogusCiA301Device
#
# CiA 301 NMT init
#
- desc:  "Power off -> NMT Initialisation"
  feedback_in:
    online:  False
    oper:  False
  feedback_out:
    online:  False
    oper:  False
    goal_reached:  False
    goal_reason:  Offline
    fault:  False
    fault_desc: ""
    param_state:  0x00  # PARAM_STATE_UNKNOWN
  command_in:
    reset_fault:  False
  command_out:
    init_params:  False
    fasttrack:  False
  sim_feedback:
    online:  True
    oper:  False
- desc:  "NMT Initialisation -> Pre-operational"
  feedback_in:
    online:  True
  feedback_out:
    online:  True
    goal_reason:  Not operational
    param_state:  0x02  # PARAM_STATE_COMPLETE
  command_out:
    init_params:  True
  sim_feedback:
    oper:  True
- desc:  "NMT Pre-operational -> Operational"
  feedback_in:
    oper:  True
  feedback_out:
    oper:  True
    goal_reached:  True
    goal_reason:  Reached
  command_out:
    init_params:  False
- desc:  "NMT Operational; hold state x1"
- desc:  "NMT Operational; hold state x2"
#
# CiA 301 NMT goes inoperational after being operational sets fault
#
- desc:  "NMC Inoperational after operational; inoperational; fault"
  sim_feedback_set:
    oper:  False
  feedback_in:
    oper:  False
  feedback_out:
    oper:  False
    goal_reached:  False
    goal_reason:  Not operational
    fault:  True
    fault_desc:  Drive went non-operational
- desc:  "NMC Inoperational after operational; hold state"
  sim_feedback_set:
    oper:  False
- desc:  "NMC Inoperational after operational; resume operational"
  feedback_in:
    oper:  True
  feedback_out:
    oper:  True
    goal_reached:  True
    goal_reason:  Reached
    fault:  False
    fault_desc:  ""
#
# CiA 301 NMT goes offline after being online sets fault
#
- desc:  "NMC offline after online; offline; fault"
  sim_feedback_set:
    online:  False
    oper:  False
  feedback_in:
    online:  False
    oper:  False
  feedback_out:
    online:  False
    oper:  False
    param_state:  0x00  # PARAM_STATE_UNKNOWN
    goal_reached:  False
    goal_reason:  Offline
    fault:  True
    fault_desc:  Drive went offline/non-operational
  sim_feedback:
    oper:  False
- desc:  "NMC offline after online; hold state"
  sim_feedback_set:
    online:  False
    oper:  False
- desc:  "NMC offline after online; back online"
  feedback_in:
    online:  True
    oper:  False
  feedback_out:
    online:  True
    oper:  False
    param_state:  0x02  # PARAM_STATE_COMPLETE
    goal_reached:  False
    goal_reason:  Not operational
    fault:  True
    fault_desc:  Drive went offline/non-operational
  command_out:
    init_params:  True
  sim_feedback:
    oper:  True
- desc:  "NMC offline after online; resume operational"
  feedback_in:
    oper:  True
  feedback_out:
    oper:  True
    goal_reached:  True
    goal_reason:  Reached
    fault:  False
    fault_desc:  ""
  command_out:
    init_params:  False
- desc:  "NMC offline after online; hold state"
