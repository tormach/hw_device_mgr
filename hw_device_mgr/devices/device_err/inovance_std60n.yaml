# From Inovance STD60N "STD60N Series Stepper System Manual Package" 2022-12, table 18-1, 18-2, 18-3, 18-4
# "Communication Faults and Warning Codes"
#
# Parameter 603Fh shows the basic error code, but the
# manufacturer-specific STD60N parameter 203Fh "Manufacturer fault
# code" shows an extended error value.  The manual's table 18-1 shows
# e.g. "fault" E101, with "display" broken down into E101.0, E101.1 and E101.2.
#
# key:  "Auxiliary Code" column most significant word
# display:  "Display" column; code displayed on drive LED panel
# description:  "Name" column
# type:  "Type" column; indicates severity, with 1 most severe
# resettable:  "Resettable" column; indicates whether resettable
#   without power cycle

#
# List of fault codes
#

'0x0101':
  display: E101.0
  description: Abnormal parameters in groups H02 and above
  type: 1
  resettable: false
'0x1101':
