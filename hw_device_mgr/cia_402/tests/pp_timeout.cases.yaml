# Test cases for bogus BogusCiA402Device, homing timeouts
#
- desc:  "Test case 0:  Command PP move"
  sim_feedback_set:
    # Jump directly to online, mode CSP, OPERATION ENABLED
    online:  True
    oper:  True
    status_word:  0x0037  # OPERATION ENABLED + VOLTAGE_ENABLED
    control_mode_fb:  1  # MODE_PP
    position_fb:  15.0
  command_in_set:
    # Override command_in "state", queried by get_feedback(), to save
    # additional setup of previous cycles
    state:  OPERATION ENABLED
    control_mode:  1  # MODE_PP
  feedback_in:
    online:  True
    oper:  True
    status_word:  0x0037  # OPERATION ENABLED + VOLTAGE_ENABLED
    control_mode_fb:  1  # MODE_PP
    position_cmd:  0.0
    position_fb:  15.0
    velocity_cmd:  0
    velocity_fb:  0
    torque_cmd:  0
    torque_fb:  0
    sto:  False
    error_code:  0x00000000
  feedback_out:
    online:  True
    oper:  True
    param_state:  0x02  # Complete
    status_word:  0x0037  # OPERATION ENABLED + VOLTAGE_ENABLED
    control_mode_fb:  1  # MODE_PP
    state:  OPERATION ENABLED
    transition:  -1
    home_success:  False
    home_error:  False
    home_found:  False
    fault:  False
    goal_reached:  True
    goal_reason:  Reached
    move_success:  False
    velocity_zero:  False
    velocity_cmd:  0
    velocity_fb:  0
    torque_cmd:  0
    torque_fb:  0
    following_error:  False
    move_setpoint_ack: False
    position_cmd:  0.0
    position_fb:  15.0
    sto:  False
    error_code:  0x00000000
    description:  No error
    fault_desc: ""
    shutdown_complete:  False
  command_in:
    state:  OPERATION ENABLED
    control_mode:  1  # MODE_PP
    reset_fault: False
    home_request:  False
    move_request:  True
    relative_target:  False
    shutdown:  False
    quick_stop: False
  command_out:
    control_word:  0x001F  # Bit 4 NEW_SETPOINT set
    control_mode:  1  # MODE_PP
    init_params:  False
    fasttrack:  True
    shutdown_latch:  False
  sim_feedback:
    online:  True
    oper:  True
    status_word:  0x0037  # OPERATION ENABLED + VOLTAGE_ENABLED
    control_mode_fb:  1  # MODE_PP
    position_cmd:  0.0
    position_fb:  0.0
    velocity_cmd:  0
    velocity_fb:  0
    torque_cmd:  0
    torque_fb:  0
    sto:  False
    error_code:  0x00000000

- desc:  "Test case 1:  NEW_SETPOINT"
  sim_feedback_set:
    position_fb:  15.0
  feedback_out:
    goal_reached:  False
    goal_reason:  move not complete
  sim_feedback:
    status_word:  0x1037  # Bit 12 SETPOINT_ACKNOWLEDGE set

- desc:  "Test case 2:  SETPOINT_ACKNOWLEDGE; clear NEW SETPOINT"
  sim_feedback_set:
    position_fb:  15.0
  feedback_in:
    status_word:  0x1037  # Bit 12 SETPOINT_ACKNOWLEDGE set
  feedback_out:
    status_word:  0x1037  # Bit 12 SETPOINT_ACKNOWLEDGE set
    move_setpoint_ack:  True
  command_out:
    control_word:  0x000F  # OPERATION ENABLED - NEW_SETPOINT

- desc:  "Test case 3:  SETPOINT_ACKNOWLEDGE cleared"
  sim_feedback_set:
    position_fb:  15.0
  sim_feedback:
    status_word:  0x0037  # Bit 12 SETPOINT_ACKNOWLEDGE cleared

- desc:  "Test case 4:  Move in progress"
  # (Repeated once)
  sim_feedback_set:
    position_fb:  15.0
  feedback_in:
    status_word:  0x0037  # Bit 12 SETPOINT_ACKNOWLEDGE cleared
  feedback_out:
    status_word:  0x0037  # Bit 12 SETPOINT_ACKNOWLEDGE cleared
    move_setpoint_ack:  False


- desc:  "Test case 5:  Move timeout exceeded; controller commands fault"
  sim_feedback_set:
    position_fb:  15.0
  feedback_out:
    # Timeout treated as fault
    fault:  True
    fault_desc:  "Timeout (15s):  move not complete"
    goal_reason:  Fault state reached; move not complete
    goal_reached:  True
  command_in:
    state:  FAULT
    home_request:  False
  command_out:
    control_word:  0x0000  # SWITCH ON DISABLED
    control_mode:  1  # MODE_PP
    fasttrack:  False
  sim_feedback:
    status_word:  0x0050  # SWITCH ON DISABLED + VOLTAGE_ENABLED
    control_mode_fb:  1  # MODE_PP
